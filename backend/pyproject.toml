[project]
name = "backend"
version = "0.1.0"
description = "NarraForge backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.109.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.1.0",
    "cryptography>=43.0.0",
    # Supabase Auth 用户 JWT 验签（ES256，纯 Python；签名运算走已 vendor 的 cryptography）
    "pyjwt>=2.8.0",
    "python-multipart>=0.0.9",
    "aiofiles>=23.2.1",
    "httpx>=0.26.0",
]
# 依赖分层说明（步骤 5 bundle 瘦身）：
# - [project.dependencies] 会整体 vendor 进 Cloudflare Workers bundle
#   （pywrangler 收集），只保留 workers 运行时真正需要的包。
# - uvicorn / sqlalchemy / pypinyin / pyyaml 是 local-only：
#   workers 不跑 ASGI server（pywrangler 自带运行时）、持久化全走
#   Supabase/PostgREST 不碰 ORM、narration git versioning 是本地能力。
#   这些都在 local-services extra（本地开发/测试安装命令已含该 extra）。
# - workers 模式下 sqlalchemy/app.models 的 import 全部有守卫或延迟
#   （见 app/core/database.py 及各 API/repo 模块的 try/except ImportError）。

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cu130", marker = "sys_platform != 'darwin'" },
]

[project.optional-dependencies]
# 本地 ML 模型依赖（Pyodide 不兼容，workers 部署不安装）
local-ml = [
    "torch>=2.0.0",
    "torchaudio>=2.0.0",
    # VoxCPM 本地 GPU TTS（需要 Python >=3.10, <3.13; PyTorch >=2.5.0; CUDA >=12.0）
    "voxcpm",
    "funasr>=1.0.0",
    "faster-whisper>=1.2.1",
    "modelscope",
    "soundfile",
]
# 含原生扩展的在线服务 SDK（workers 模式用 httpx/内置 WS 客户端替代），
# 以及 local-only 工作流/调度依赖（langgraph 链的 sqlite-vec 无 Pyodide wheel，
# apscheduler 仅 local startup 注册 —— 均不进 workers vendor 目标）
local-services = [
    # local ASGI server（workers 用 pywrangler 自带运行时）
    "uvicorn>=0.27.0",
    # 本地持久化 ORM（workers 全走 Supabase/PostgREST，不 vendor）
    "sqlalchemy>=2.0.25",
    # Narration git versioning（本地能力：git + 文件系统）
    "pypinyin>=0.51",
    "pyyaml>=6.0",
    "edge-tts>=7.0.0",
    "dashscope>=1.25.0",
    "qiniu>=7.17.0",
    # 遗留工作流依赖（app 代码已无引用，agent/ 服务独立管理依赖）
    "langgraph>=1.2.0",
    "langgraph-checkpoint-sqlite>=1.0.0",
    "aiosqlite>=0.20.0",
    # Narration git versioning 定时快照（local startup 才注册）
    "apscheduler>=3.10",
]
test = [
    "pytest>=7.4.4",
    "pytest-asyncio>=0.23.2",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "pytest-xdist>=3.5.0",
    "requests-mock>=1.11.0",
    "sqlalchemy-utils>=0.41.1",
    "freezegun>=1.2.2",
    "factory-boy>=3.3.0",
    "Faker>=21.0.0",
    "starlette-testclient>=0.3.0"
]
# Cloudflare Workers 部署工具链：workers-py 包提供 pywrangler CLI（spike 同款）。
# 注意：[project.dependencies] 中 pydantic-core/cryptography 为 Rust 扩展，
# pywrangler vendor 时会解析 Pyodide 发行版的对应 wheel（见 docs/RUNBOOK.md）。
workers = [
    "workers-py",
]
dev = [
    "black>=23.12.1",
    "flake8>=6.1.0",
    "isort>=5.13.2",
    "mypy>=1.8.0"
]

[dependency-groups]
# Vercel 部署依赖组：Vercel Python 构建跑 `uv sync --active --no-dev`
# （无 --extra 入口，见 vercel/vercel packages/python/src/uv.ts），只安装
# [project.dependencies] + 默认依赖组。把 vercel-deploy 列入 default-groups，
# 使 Vercel 环境装上 edge-tts（workers 模式 CPython 回退所需）；本地
# `uv sync --extra local-services` 已含 edge-tts，重复无害。
# 注意：本组不进 CF Workers bundle（pywrangler 只收集 [project.dependencies]）。
vercel-deploy = [
    "edge-tts>=7.0.0",
]

[tool.uv]
default-groups = ["vercel-deploy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = ["--ignore=tests/manual"]
norecursedirs = ["manual"]
markers = [
    "integration: integration tests",
    "external: tests that call external services",
]

